<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>นักบินอวกาศน้อย ฝึกพิมพ์ไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sriracha&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#2b3a8f;
    --sky-mid:#5b6fd8;
    --sky-bottom:#a6c4ff;
    --sun:#ffd166;
    --pink:#ff6fa5;
    --cyan:#3ddbd9;
    --green:#3ec97a;
    --card-bg:#fffdf7;
    --ink:#26264d;
    --pending:#6b6b8a;
    --wrong:#ff4d5e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Sarabun',sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.5) 0px, rgba(255,255,255,0) 2px),
      radial-gradient(circle at 80% 10%, rgba(255,255,255,0.6) 0px, rgba(255,255,255,0) 2px),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
    background-size: 40px 40px, 40px 40px, 100% 100%;
    color:var(--ink);
    overflow-x:hidden;
    position:relative;
  }
  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }
  .stars span{
    position:absolute; width:4px; height:4px; background:#fff; border-radius:50%;
    opacity:.8; animation:twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7);}50%{opacity:1;transform:scale(1.2);}}

  .wrap{
    position:relative; z-index:1;
    max-width:900px; margin:0 auto; padding:24px 18px 60px;
  }

  header{ text-align:center; margin-bottom:18px; }
  header h1{
    font-family:'Sriracha',cursive;
    color:#fff;
    font-size:clamp(24px,4vw,36px);
    margin:0 0 4px;
    text-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  header p{
    color:#eef2ff; font-size:16px; margin:0; opacity:.9;
  }

  /* ---- planet track ---- */
  .track-panel{
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.35);
    border-radius:24px;
    padding:26px 20px 18px;
    margin-bottom:22px;
    backdrop-filter: blur(2px);
  }
  .track{
    position:relative;
    height:70px;
    margin:0 10px;
  }
  .track-line{
    position:absolute; left:0; right:0; top:34px; height:6px;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.6) 0 10px, transparent 10px 20px);
    border-radius:3px;
  }
  .planet{
    position:absolute; top:14px; transform:translateX(-50%);
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Sriracha',cursive; font-size:16px; color:#fff;
    border:3px solid rgba(255,255,255,.7);
    background:linear-gradient(160deg,#8c8cff,#5252c9);
    box-shadow:0 4px 10px rgba(0,0,0,.25);
    transition:transform .3s ease, background .3s ease;
  }
  .planet.done{ background:linear-gradient(160deg,#5be08a,var(--green)); }
  .planet.active{
    background:linear-gradient(160deg,#ffd166,#ff9f43);
    transform:translateX(-50%) scale(1.18);
    box-shadow:0 0 0 6px rgba(255,209,102,.35), 0 4px 10px rgba(0,0,0,.25);
  }
  .rocket{
    position:absolute; top:-16px; transform:translateX(-50%);
    font-size:34px; transition:left .8s cubic-bezier(.34,1.56,.64,1);
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));
  }

  /* ---- main card ---- */
  .card{
    background:var(--card-bg);
    border-radius:28px;
    padding:30px 26px;
    box-shadow:0 14px 0 rgba(0,0,0,.12), 0 20px 40px rgba(0,0,0,.25);
    position:relative;
  }
  .level-title{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .level-badge{
    font-family:'Sriracha',cursive;
    background:var(--pink); color:#fff;
    padding:6px 16px; border-radius:999px; font-size:15px;
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  .level-name{ font-weight:700; font-size:18px; color:var(--ink); }

  .progressbar{
    width:100%; height:16px; background:#e9e6f7; border-radius:999px; overflow:hidden;
    margin-bottom:22px; border:2px solid #d8d4ef;
  }
  .progressbar-fill{
    height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,var(--cyan),var(--green));
    transition:width .25s ease;
  }

  .text-box{
    font-size:30px;
    line-height:2.1;
    letter-spacing:.5px;
    padding:22px 20px;
    background:#f5f3ff;
    border-radius:18px;
    border:2px dashed #cfc9f0;
    overflow-wrap:anywhere;
    word-break:break-word;
    min-height:120px;
  }
  .char{ color:var(--pending); transition:color .15s ease; }
  .char.correct{ color:var(--green); font-weight:600; }
  .char.current{
    background:var(--sun);
    border-radius:5px;
    box-shadow:0 0 0 3px rgba(255,209,102,.6);
    animation:pulse 1s ease-in-out infinite;
    color:var(--ink);
  }
  .char.current.wrong{
    background:var(--wrong) !important;
    color:#fff !important;
    animation:shake .3s ease;
  }
  .char.space{
    display:inline-block;
    min-width:22px;
    border-bottom:3px solid #cfc9f0;
    margin:0 2px;
    vertical-align:baseline;
  }
  .char.space.correct{ border-bottom-color:var(--green); }
  .char.space.current{ border-bottom-color:var(--ink); }

  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  .hint{
    margin-top:18px; text-align:center; color:var(--pending); font-size:15px;
  }
  .hint b{ color:var(--ink); }

  /* ---- success overlay ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,20,50,.55);
    display:flex; align-items:center; justify-content:center;
    z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .overlay-card{
    background:#fff; border-radius:26px; padding:40px 36px; text-align:center;
    max-width:420px; width:90%;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    transform:translateY(20px) scale(.9); transition:transform .3s ease;
  }
  .overlay.show .overlay-card{ transform:translateY(0) scale(1); }
  .overlay-emoji{ font-size:64px; margin-bottom:6px; }
  .overlay-card h2{
    font-family:'Sriracha',cursive; color:var(--ink); margin:0 0 8px; font-size:26px;
  }
  .overlay-card p{ color:var(--pending); font-size:16px; margin:0 0 22px; }
  .next-btn{
    font-family:'Sriracha',cursive;
    background:linear-gradient(160deg,#ff9f43,var(--pink));
    color:#fff; border:none; font-size:20px; padding:14px 34px; border-radius:999px;
    cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.2);
    transition:transform .1s ease;
  }
  .next-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.2); }

  .confetti{
    position:absolute; top:-10px; width:10px; height:10px; border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(500px) rotate(360deg); opacity:0; }
  }

  @media (max-width:520px){
    .text-box{ font-size:26px; line-height:2; padding:16px 14px; }
    .planet{ width:38px; height:38px; font-size:14px; }
    .rocket{ font-size:28px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrap">
  <header>
    <h1>🚀 นักบินอวกาศน้อย ฝึกพิมพ์ไทย 🚀</h1>
    <p>พิมพ์ให้ถูกต้องเพื่อพาจรวดเดินทางไปให้ครบ 5 ดาว!</p>
  </header>

  <div class="track-panel">
    <div class="track" id="track">
      <div class="track-line"></div>
      <!-- planets and rocket injected by JS -->
    </div>
  </div>

  <div class="card">
    <div class="level-title">
      <span class="level-badge" id="levelBadge">ด่านที่ 1</span>
      <span class="level-name" id="levelName"></span>
    </div>

    <div class="progressbar"><div class="progressbar-fill" id="progressFill"></div></div>

    <div class="text-box" id="textBox"></div>

    <div class="hint">พิมพ์ตัวอักษรที่มี <b>แถบสีเหลือง</b> ไม่ต้องกด Backspace เลย ถ้าพิมพ์ผิดแค่ลองพิมพ์ตัวเดิมใหม่ได้เลย 😊</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="overlay-emoji" id="overlayEmoji">🎉</div>
    <h2 id="overlayTitle">เก่งมาก!</h2>
    <p id="overlayText">ผ่านด่านนี้เรียบร้อยแล้ว</p>
    <button class="next-btn" id="nextBtn">ไปด่านต่อไป 🚀</button>
  </div>
</div>

<script>
(function(){
  const levels = [
    { name: "สุภาษิต", text: "ความพยายามอยู่ที่ไหน ความสำเร็จอยู่ที่นั่น" },
    { name: "สุภาษิต", text: "ฝนทั่งให้เป็นเข็ม" },
    { name: "ประโยค", text: "เด็กดีต้องมีความกตัญญูและเชื่อฟังคำสั่งสอนของบิดามารดา" },
    { name: "ประโยค", text: "การออกกำลังกายสม่ำเสมอช่วยให้ร่างกายแข็งแรงและจิตใจแจ่มใส" },
    { name: "บทความ", text: "เช้าวันนี้เด็กๆ ในโรงเรียนมีความสุขมาก เพราะครูจัดกิจกรรมพิเศษให้ทุกคนได้ลองทำสิ่งใหม่ๆ กันอย่างเต็มที่ เด็กบางคนช่วยกันปลูกผักในแปลงเล็กๆ หลังอาคารเรียน ส่วนบางคนฝึกวาดรูปสัตว์ต่างๆ เช่น ช้าง ม้า และลิงอย่างตั้งใจ ทุกคนยิ้มแย้มและพูดคุยกันด้วยถ้อยคำสุภาพ ทำให้บรรยากาศสดใสและอบอุ่นมากขึ้น หลังจากพักกินขนม เด็กๆ ได้ลองเล่นเกมฝึกสังเกตสิ่งรอบตัว เช่น สีของใบไม้ เสียงนกที่อยู่บนต้นไม้ และรูปร่างของเมฆบนท้องฟ้า กิจกรรมนี้ช่วยให้เด็กใช้สายตา หู และใจไปพร้อมกัน เด็กหลายคนบอกว่ารู้สึกตื่นเต้นและอยากเรียนรู้สิ่งใหม่ๆ เพิ่มอีกในวันต่อไป ครูจึงชื่นใจที่เห็นทุกคนตั้งใจและกล้าแสดงออกอย่างเต็มที่" }
  ];

  let currentLevel = 0;
  let currentIndex = 0;
  let chars = [];
  let overlayVisible = false;

  const textBox = document.getElementById('textBox');
  const levelBadge = document.getElementById('levelBadge');
  const levelName = document.getElementById('levelName');
  const progressFill = document.getElementById('progressFill');
  const track = document.getElementById('track');
  const overlay = document.getElementById('overlay');
  const overlayEmoji = document.getElementById('overlayEmoji');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const nextBtn = document.getElementById('nextBtn');

  // ---------- background stars ----------
  function makeStars(){
    const box = document.getElementById('stars');
    let html = '';
    for(let i=0;i<50;i++){
      const top = Math.random()*100;
      const left = Math.random()*100;
      const delay = (Math.random()*2.4).toFixed(2);
      const size = (Math.random()*2+2).toFixed(1);
      html += `<span style="top:${top}%;left:${left}%;animation-delay:${delay}s;width:${size}px;height:${size}px;"></span>`;
    }
    box.innerHTML = html;
  }

  // ---------- planet track ----------
  function buildTrack(){
    let html = '';
    levels.forEach((lv, i)=>{
      const pos = (i/(levels.length-1))*100;
      html += `<div class="planet" data-i="${i}" style="left:${pos}%;">${i+1}</div>`;
    });
    html += `<div class="rocket" id="rocket">🚀</div>`;
    track.innerHTML = track.querySelector('.track-line').outerHTML + html;
  }

  function updateTrack(){
    document.querySelectorAll('.planet').forEach(p=>{
      const i = parseInt(p.dataset.i);
      p.classList.remove('done','active');
      if(i < currentLevel) p.classList.add('done');
      else if(i === currentLevel) p.classList.add('active');
    });
    const rocket = document.getElementById('rocket');
    const pos = (currentLevel/(levels.length-1))*100;
    rocket.style.left = pos + '%';
  }

  // ---------- level loading ----------
  function loadLevel(idx){
    currentLevel = idx;
    currentIndex = 0;
    const lv = levels[idx];
    chars = Array.from(lv.text);

    levelBadge.textContent = 'ด่านที่ ' + (idx+1);
    levelName.textContent = lv.name;

    let html = '';
    chars.forEach((ch, i)=>{
      const isSpace = ch === ' ';
      const cls = ['char'];
      if(isSpace) cls.push('space');
      if(i === 0) cls.push('current');
      html += `<span class="${cls.join(' ')}" data-i="${i}">${isSpace ? '&nbsp;' : ch}</span>`;
    });
    textBox.innerHTML = html;
    updateProgress();
    updateTrack();
  }

  function updateProgress(){
    const pct = (currentIndex / chars.length) * 100;
    progressFill.style.width = pct + '%';
  }

  function getSpan(i){
    return textBox.querySelector(`.char[data-i="${i}"]`);
  }

  function handleCorrect(){
    const span = getSpan(currentIndex);
    span.classList.remove('current');
    span.classList.add('correct');
    currentIndex++;
    updateProgress();

    if(currentIndex >= chars.length){
      levelComplete();
      return;
    }
    const next = getSpan(currentIndex);
    next.classList.add('current');
  }

  function handleWrong(){
    const span = getSpan(currentIndex);
    span.classList.add('wrong');
    setTimeout(()=>{ span.classList.remove('wrong'); }, 250);
  }

  function levelComplete(){
    overlayVisible = true;
    const isLast = currentLevel === levels.length - 1;
    if(isLast){
      overlayEmoji.textContent = '🏆';
      overlayTitle.textContent = 'สุดยอด! เก่งที่สุด!';
      overlayText.textContent = 'ผ่านครบทั้ง 5 ด่านแล้ว เยี่ยมมากจ้ะนักบินอวกาศตัวน้อย!';
      nextBtn.textContent = 'เล่นอีกครั้ง 🔄';
    } else {
      overlayEmoji.textContent = '🎉';
      overlayTitle.textContent = 'เก่งมาก! ผ่านด่านนี้แล้ว';
      overlayText.textContent = 'พร้อมไปด่านต่อไปหรือยัง?';
      nextBtn.textContent = 'ไปด่านต่อไป 🚀';
    }
    launchConfetti();
    overlay.classList.add('show');
    updateTrack();
  }

  function launchConfetti(){
    const colors = ['#ff6fa5','#ffd166','#3ddbd9','#3ec97a','#5252c9'];
    const card = overlay.querySelector('.overlay-card');
    for(let i=0;i<26;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random()*100 + '%';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (1.2 + Math.random()*1.2) + 's';
      c.style.animationDelay = (Math.random()*0.4) + 's';
      card.appendChild(c);
      setTimeout(()=>c.remove(), 3000);
    }
  }

  nextBtn.addEventListener('click', ()=>{
    overlay.classList.remove('show');
    overlayVisible = false;
    const isLast = currentLevel === levels.length - 1;
    if(isLast){
      loadLevel(0);
    } else {
      loadLevel(currentLevel + 1);
    }
  });

  // ---------- keyboard handling ----------
  document.addEventListener('keydown', (e)=>{
    if(overlayVisible){
      if(e.key === 'Enter'){ nextBtn.click(); }
      return;
    }
    const key = e.key;
    if(key.length !== 1) return; // ignore Shift, Enter, Backspace, arrows, etc.
    e.preventDefault();

    const expected = chars[currentIndex];
    if(key === expected){
      handleCorrect();
    } else {
      handleWrong();
    }
  });

  // ---------- init ----------
  makeStars();
  buildTrack();
  loadLevel(0);
})();
</script>
</body>
</html>
